[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portacheck"
version = "0.2.0"
description = "Catch file names that break Windows and macOS checkouts: reserved names, invalid characters, case and Unicode collisions, long paths. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "calasdan-sketch" }]
keywords = ["windows", "macos", "unicode", "sarif", "pre-commit", "portability", "git", "filenames", "case-sensitivity", "paths", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
portacheck = "portacheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
