[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portacheck"
version = "0.3.0"
description = "Catch file names that break Windows and macOS checkouts, or attack them: reserved names, case and Unicode collisions, .git aliases, hostile .gitmodules, long paths. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Calas Automations Inc." }]
maintainers = [{ name = "Calas Automations Inc." }]
keywords = ["windows", "macos", "unicode", "sarif", "pre-commit", "portability", "git", "filenames", "case-sensitivity", "paths", "ci", "security", "submodules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/portacheck"
Source = "https://github.com/calasdan-sketch/portacheck"
Issues = "https://github.com/calasdan-sketch/portacheck/issues"
Changelog = "https://github.com/calasdan-sketch/portacheck/blob/main/CHANGELOG.md"

[project.scripts]
portacheck = "portacheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portacheck = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]   # `pytest` works from a fresh checkout without installing first
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]   # real errors only; the code base keeps its compact style
